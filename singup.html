<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../res/icon/logo-takax.png" type="image/x-icon">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/global.css">
    <script src="js/singup.js" type="module"></script>
    <title>TAKAX - Registro</title>
</head>

<body>
    <section>
        <h2>Registro</h2>
        <form id="signupForm">
            <label>Datos generales</label>
            <input type="text" placeholder="Introduce tu nombre de empresa/centro" id="name" required autofocus>
            <input type="email" placeholder="Introduce tu email" id="email" required>
            <input type="password" placeholder="Introduce tu contraseña" id="password" required>
            <input type="password" placeholder="Confirma tu contraseña" id="password-confirm" required>
            <input type="tel" placeholder="Introduce tu teléfono" id="phone" required>
            <input type="text" placeholder="Introduce tu RFC" id="rfc" required>
            <label>Tipo de Cuenta</label>
            <select id="tipo" required>
                <option value="">Selecciona un tipo</option>
                <option value="empresa">Empresa</option>
                <option value="centro">Centro</option>
            </select>
            <div id="empresa-detalles">
                <input type="text" placeholder="Introduce la clase de tu empresa (Ej. Tienda de conveniencia, Supermercado, etc.)" id="clase" required>
            </div>
            <input type="submit" class="btn" value="Registro">
        </form>
        <p>Ya tienes una cuenta? <a href="login.html">Login</a></p>
    </section>
    <footer class="main-footer">
        <p>© 2025 VitaDevs - TAKAX.</p>
    </footer>
</body>
</html>
